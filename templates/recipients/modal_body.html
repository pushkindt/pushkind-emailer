<div class="modal-body">
    <form action="/recipients/save" method="POST">
        <input type="hidden" value="{{recipient.recipient.id}}" name="id" required>
        <div class="row mb-3">
            <label for="modalUserName" class="col-md-2 col-form-label">Имя</label>
            <div class="col-md-10">
                <input name="name" type="text" class="form-control" id="modalUserName" value="{{recipient.recipient.name}}" placeholder="Имя" required>
                {% if recipient.recipient.unsubscribed_at %}
                    <small class="text-body-secondary">Получатель отписался {{recipient.recipient.unsubscribed_at | date(format="%Y-%m-%d %H:%M")}}</small>
                {% endif %}
            </div>
        </div>
        <div class="row mb-3">
            <label for="modalUserEmail" class="col-md-2 col-form-label">Электронный адрес</label>
            <div class="col-md-10">
                <input name="email" type="email" class="form-control" id="modalUserEmail" value="{{recipient.recipient.email}}" placeholder="Электронный адрес" required>
            </div>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" value="true" {% if not recipient.recipient.unsubscribed_at %}checked{% endif %} id="active" name="active">
            <label class="form-check-label" for="active">
                Действующий
            </label>
        </div>

        <div class="row mb-3">
            <label for="recipients-assign-form-group-id" class="col-md-2 col-form-label">Группы</label>
            <div class="col-md-10">
                <select multiple class="form-control my-1" name="groups" id="recipients-assign-form-group-id">
                    {% for group in groups %}
                        <option value="{{group.id}}" {% if recipient.recipient.groups is containing(group.id) %} selected {% endif %}>{{group.name}}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div id="custom-fields">

            {% for field, value in recipient.recipient.fields %}
                <div class="row mb-3">
                    <div class="col">
                        <input type="text" class="form-control" value="{{field}}" name="field" required placeholder="Поле">
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" value="{{value}}" name="value" required" placeholder="Значение">
                    </div>
                    <div class="col-auto">
                        <a href="#" class="btn btn-danger btn-sm" onclick="removeCustomField(this)">
                            <i class="bi bi-slash-circle"></i>
                        </a>
                    </div>
                </div>

            {% endfor %}
        </div>

        <div class="row mb-3">
            <div class="col">
                <button class="btn btn-primary" type="submit">Сохранить</button>
            </div>
            <div class="col-auto">
                <a href="#" class="btn btn-primary btn-sm" onclick="addCustomField(this)">
                    <i class="bi bi-plus"></i>
                </a>
            </div>
        </div>
    </form>
</div>

<form action="/recipients/delete" method="POST">
    <input type="hidden" value="{{recipient.recipient.id}}" name="id" required>
    <div class="modal-footer">
        <button class="btn btn-danger" type="submit" onclick="return confirm('Удалить?')">Удалить</button>
    </div>
</form>
